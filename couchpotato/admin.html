<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <meta name="robots" content="noindex">
  <title>Factory Manager · Owner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- The app owner signs in here. There is no sign-up: the owner's email is set on the site. -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="login-form" data-mode="in">
      <div class="login-brand">
        <h1 class="wordmark" id="product-name">Factory Manager</h1>
        <div class="rule"></div>
        <p class="wordsub">Owner</p>
      </div>
      <div id="login-mode"></div>
      <p class="login-lead">Every company on the app, their trials and payments. Sign in with the owner's login.</p>
      <label class="fld"><span>Email</span>
        <input id="login-email" type="email" autocomplete="username" required placeholder="you@yourcompany.co.za">
      </label>
      <label class="fld"><span>Password</span>
        <input id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <button class="btn primary wide" type="submit" id="login-submit">Sign in</button>
      <button class="login-link" type="button" id="login-forgot">Forgot your password?</button>
      <p id="login-status" class="login-status" role="status"></p>
    </form>
  </section>

  <div id="app" hidden></div>

  <noscript><p style="padding:2rem;font:16px system-ui">This page needs JavaScript switched on.</p></noscript>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
