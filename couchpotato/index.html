<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <title>Factory Manager</title>
  <meta name="description" content="Factory management for furniture makers: orders, the floor, costing, dispatch and invoicing.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Sign in, start a trial, or join a team -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="login-form" data-mode="in">
      <div class="login-brand">
        <h1 class="wordmark" id="product-name">Factory Manager</h1>
        <div class="rule"></div>
        <p class="wordsub" id="product-tag">For furniture makers</p>
      </div>
      <div id="login-mode"></div>
      <div class="login-switch" id="login-switch">
        <button type="button" data-mode="in">Sign in</button>
        <button type="button" data-mode="up">Start free trial</button>
      </div>
      <p class="login-lead" id="login-lead"></p>
      <label class="fld" data-for="up"><span>Company name</span>
        <input id="login-company" autocomplete="organization" placeholder="e.g. Couch Potato">
      </label>
      <label class="fld" data-for="up join"><span>Your name</span>
        <input id="login-name" autocomplete="name" placeholder="First name and surname">
      </label>
      <label class="fld" data-for="in up join"><span>Email</span>
        <input id="login-email" type="email" autocomplete="username" required placeholder="you@yourcompany.co.za">
      </label>
      <label class="fld" data-for="in up join"><span>Password</span>
        <input id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <button class="btn primary wide" type="submit" id="login-submit">Sign in</button>
      <button class="login-link" type="button" id="login-forgot" data-for="in">Forgot your password?</button>
      <p id="login-status" class="login-status" role="status"></p>
    </form>
  </section>

  <!-- The app itself: header, tabs and the active screen -->
  <div id="app" hidden></div>

  <noscript><p style="padding:2rem;font:16px system-ui">This system needs JavaScript switched on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
