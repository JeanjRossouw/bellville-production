<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ReptiCube POS</title>

<!-- Firebase (used for sales log / offline queue / staff in later phases) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, query, where, orderBy, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Reuses the existing Firebase project (separate Firestore collections for the till).
  const firebaseConfig = {
    apiKey: "AIzaSyB5QfSiuwjDGwZOZMHzN3BhziK_AKVeBNg",
    authDomain: "bellville-production-ffb19.firebaseapp.com",
    projectId: "bellville-production-ffb19",
    storageBucket: "bellville-production-ffb19.firebasestorage.app",
    messagingSenderId: "505275243511",
    appId: "1:505275243511:web:8419f7ca02e9dc542f2cf2"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  enableIndexedDbPersistence(db).catch(() => {});
  // Kiosk auth so Firestore rules that require a signed-in user pass. Staff PINs
  // (Phase 4) are an app-level layer on top of this.
  signInAnonymously(auth).catch((e) => console.warn('Anon auth unavailable:', e.message));

  window.fb = {
    db, auth,
    fns: { doc, setDoc, getDoc, collection, addDoc, getDocs, query, where, orderBy, onAuthStateChanged }
  };
  window.dispatchEvent(new Event('fb-ready'));
</script>

<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2b3140;
    --text:#eef1f6; --muted:#9aa4b6; --accent:#16a34a; --accent2:#22c55e;
    --warn:#f59e0b; --danger:#ef4444;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; -webkit-text-size-adjust:100%; }
  button { font-family:inherit; }
  input { font-family:inherit; }

  header { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.6rem 1rem; background:var(--panel); border-bottom:1px solid var(--border); }
  header .brand { font-weight:800; font-size:1.05rem; letter-spacing:0.02em; }
  header .brand span { color:var(--accent2); }
  .status { font-size:0.75rem; color:var(--muted); display:flex; gap:0.75rem; align-items:center; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--accent2); }
  .dot.off { background:var(--danger); }

  .shell { display:flex; height:calc(100vh - 53px); }
  .left { flex:2; min-width:0; display:flex; flex-direction:column; padding:0.85rem; }
  .right { flex:1; min-width:320px; max-width:440px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; }

  #scan { width:100%; padding:1rem 1.1rem; font-size:1.1rem; border-radius:12px; border:2px solid var(--accent); background:var(--panel2); color:var(--text); outline:none; }
  #scan::placeholder { color:var(--muted); }

  #grid { flex:1; overflow:auto; margin-top:0.8rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); grid-auto-rows:min-content; gap:0.6rem; align-content:start; }
  .tile { text-align:left; padding:0.55rem; border:1px solid var(--border); background:var(--panel2); border-radius:12px; color:var(--text); cursor:pointer; transition:transform .05s; }
  .tile:active { transform:scale(0.97); }
  .tile:disabled { opacity:0.45; cursor:not-allowed; }
  .tile .thumb { height:86px; border-radius:8px; background:#0b0d11 center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin-bottom:0.45rem; }
  .tile .nm { font-size:0.8rem; font-weight:600; line-height:1.15; height:2.3em; overflow:hidden; }
  .tile .pr { font-size:1rem; font-weight:800; color:var(--accent2); margin-top:0.25rem; }
  .tile .st { font-size:0.7rem; color:var(--muted); }

  .right .rhead { padding:0.85rem; border-bottom:1px solid var(--border); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  #cart { flex:1; overflow:auto; padding:0.5rem 0.85rem; }
  .empty { color:var(--muted); text-align:center; padding:2.5rem 1rem; font-style:italic; }
  .line { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 0; border-bottom:1px solid var(--border); }
  .line .lnm { flex:1; min-width:0; }
  .line .lnm .t { font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .line .lnm .s { font-size:0.72rem; color:var(--muted); }
  .qbtn { width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:1.1rem; cursor:pointer; }
  .qty { min-width:26px; text-align:center; font-weight:700; }
  .ltot { min-width:78px; text-align:right; font-weight:700; }
  .rm { background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; }

  .foot { border-top:1px solid var(--border); padding:0.85rem; background:var(--panel); }
  .total { display:flex; justify-content:space-between; align-items:baseline; font-weight:800; font-size:1.6rem; margin-bottom:0.6rem; }
  .total .accent { color:var(--accent2); }
  .btn { width:100%; padding:0.95rem; border-radius:12px; border:none; font-size:1.05rem; font-weight:800; cursor:pointer; }
  .btn-pay { background:var(--accent); color:#04210f; }
  .btn-ghost { background:var(--panel2); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:#000; color:#fff; padding:0.6rem 1rem; border-radius:10px; font-size:0.9rem; opacity:0; transition:opacity .2s; z-index:50; }
  .toast.show { opacity:0.95; }

  .modal { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.65); display:none; align-items:center; justify-content:center; }
  .modal.show { display:flex; }
  .modal-card { width:420px; max-width:94vw; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:1.1rem; }
  .modal-card h2 { margin:0 0 0.2rem; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; }
  .pay-total { font-size:2rem; font-weight:800; text-align:center; color:var(--accent2); margin:0.2rem 0 0.9rem; }
  .pay-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; }
  .pay-grid button { padding:0.9rem 0.4rem; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:0.95rem; font-weight:700; cursor:pointer; }
  .field { margin-top:0.85rem; }
  .field label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:0.25rem; }
  .field input { width:100%; padding:0.7rem; font-size:1.1rem; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  .change { font-size:1.05rem; font-weight:700; margin-top:0.6rem; }
  .custbar { padding:0.6rem 0.85rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
  .custbar .cinfo { min-width:0; }
  .custbar .cinfo .cn { font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .custbar .cinfo .cm { font-size:0.72rem; color:var(--muted); }
  .custbar button { padding:0.4rem 0.7rem; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:0.8rem; cursor:pointer; }
  .cust-result { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; padding:0.55rem; border-bottom:1px solid var(--border); cursor:pointer; }
  .cust-result:hover { background:var(--panel2); }
</style>
</head>
<body>
<header>
  <div class="brand">Repti<span>Cube</span> · POS</div>
  <div class="status">
    <span id="store" title="Connected Shopify store">—</span>
    <span id="net"><span class="dot" id="net-dot"></span> <span id="net-txt">online</span></span>
    <span id="cat-status">loading catalogue…</span>
    <button class="qbtn" title="Parked sales" onclick="openParked()" style="width:auto;padding:0 0.6rem;height:30px;font-size:0.8rem">⏸ Parked</button>
    <button class="qbtn" title="Register / cash-up" onclick="openReg()" style="width:auto;padding:0 0.6rem;height:30px;font-size:0.8rem">🧾 Register</button>
    <button class="qbtn" title="Refresh catalogue" onclick="refreshCatalogue(true)" style="width:auto;padding:0 0.6rem;height:30px;font-size:0.8rem">↻</button>
    <span id="staff-badge" style="font-size:0.78rem; color:var(--muted)"></span>
    <button class="qbtn" title="Lock" onclick="lockPOS()" style="width:auto;padding:0 0.6rem;height:30px;font-size:0.8rem">🔒</button>
  </div>
</header>

<div class="shell">
  <div class="left">
    <input id="scan" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="🔍 Scan barcode or search by name / SKU…">
    <div id="grid"></div>
  </div>
  <div class="right">
    <div id="customer" class="custbar"></div>
    <div class="rhead"><span>Cart</span><div style="display:flex; gap:0.6rem"><button class="rm" onclick="parkSale()" title="Park this sale">⏸ Park</button><button class="rm" onclick="clearCart()" title="Clear cart">Clear</button></div></div>
    <div id="cart"></div>
    <div class="foot">
      <div class="total"><span>TOTAL</span><span class="accent" id="grand">R0.00</span></div>
      <button class="btn btn-pay" id="pay-btn" onclick="payOpen()">Pay · 0 items</button>
    </div>
  </div>
</div>

<div class="modal" id="pay-modal">
  <div class="modal-card">
    <h2><span>Take payment</span><button class="rm" onclick="payClose()">✕</button></h2>
    <div class="pay-total" id="pay-total">R0.00</div>
    <div class="pay-grid">
      <button onclick="payPick('cash')">💵 Cash</button>
      <button onclick="payPick('card')">💳 Card — paid</button>
      <button onclick="payPick('eft')">🏦 EFT — paid</button>
      <button onclick="payPick('split')">↔ Split</button>
    </div>
    <div id="pay-detail"></div>
  </div>
</div>

<div class="modal" id="cust-modal">
  <div class="modal-card">
    <h2><span>Customer</span><button class="rm" onclick="custClose()">✕</button></h2>
    <div id="cust-body"></div>
  </div>
</div>

<div class="modal" id="park-modal">
  <div class="modal-card">
    <h2><span>Parked sales</span><button class="rm" onclick="closeParked()">✕</button></h2>
    <div id="park-body"></div>
  </div>
</div>

<div class="modal" id="reg-modal">
  <div class="modal-card">
    <h2><span>Register</span><button class="rm" onclick="closeReg()">✕</button></h2>
    <div id="reg-body"></div>
  </div>
</div>

<div id="lock" style="position:fixed; inset:0; z-index:200; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:1rem">
  <div style="font-weight:800; font-size:1.3rem">Repti<span style="color:var(--accent2)">Cube</span> · POS</div>
  <div id="lock-name" style="color:var(--muted); font-size:0.9rem">Enter your PIN</div>
  <div id="lock-dots" style="font-size:1.8rem; letter-spacing:0.4rem; height:2rem">····</div>
  <div id="lock-pad" style="display:grid; grid-template-columns:repeat(3,72px); gap:0.6rem"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const FN = '/.netlify/functions/reptipos-shopify';
  let catalogue = [];      // products incl. priceCents (integer money — never floats)
  let locationId = null;
  let cart = [];           // [{ variantId, qty, disc:{type,value}? }]
  let cartDiscount = null; // { type:'pct'|'amt', value } applied to the whole cart
  let customer = null;     // { id, name, email, phone } attached to the sale
  let saleInFlight = false; // guard against double-submit creating duplicate orders
  let custSearchTimer = null;

  // Money is integer CENTS everywhere internally. money() formats cents → "R…".
  const money = c => 'R' + ((Number(c) || 0) / 100).toFixed(2);
  const toCents = r => Math.round((parseFloat(r) || 0) * 100);
  // Normalise catalogue rows to carry integer priceCents.
  function normProducts(arr) {
    return (arr || []).map(p => ({ ...p, priceCents: (p.priceCents != null ? p.priceCents : Math.round((Number(p.price) || 0) * 100)) }));
  }
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }

  function setStore(name, domain) {
    const el = document.getElementById('store');
    if (!el) return;
    const label = name || domain || '—';
    el.textContent = '🏪 ' + label;
    // Highlight if it doesn't look like the ReptiCube store (e.g. a dev store) so
    // you never write a real sale to the wrong place by accident.
    const live = /repticube/i.test(name || '') || /repticube/i.test(domain || '');
    el.style.color = live ? 'var(--muted)' : 'var(--warn)';
    el.title = 'Connected store: ' + (domain || label);
  }

  function setNet(online) {
    document.getElementById('net-dot').classList.toggle('off', !online);
    document.getElementById('net-txt').textContent = online ? 'online' : 'offline';
  }
  window.addEventListener('online', () => setNet(true));
  window.addEventListener('offline', () => setNet(false));
  setNet(navigator.onLine);

  // ---- Catalogue: load cached instantly, then refresh from Shopify ----
  function loadCached() {
    try {
      const c = JSON.parse(localStorage.getItem('reptipos-catalogue') || 'null');
      if (c && Array.isArray(c.products)) { catalogue = normProducts(c.products); locationId = c.locationId || null; return true; }
    } catch (e) {}
    return false;
  }
  function cacheCatalogue() {
    try { localStorage.setItem('reptipos-catalogue', JSON.stringify({ products: catalogue, locationId, at: Date.now() })); } catch (e) {}
  }

  async function refreshCatalogue(manual) {
    const st = document.getElementById('cat-status');
    st.textContent = 'syncing…';
    try {
      const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'getProducts' }) });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + (await res.text()).slice(0, 120));
      const data = await res.json();
      catalogue = normProducts(data.products || []);
      locationId = data.locationId || null;
      if (data.shopName || data.domain) setStore(data.shopName, data.domain);
      cacheCatalogue();
      st.textContent = catalogue.length + ' products';
      renderGrid();
      if (manual) toast('Catalogue updated');
    } catch (e) {
      console.warn('Catalogue refresh failed:', e);
      st.textContent = catalogue.length ? (catalogue.length + ' products (cached)') : 'catalogue error';
      st.title = String(e.message || e);
      if (!catalogue.length) toast('Catalogue failed: ' + (e.message || e));
    }
  }

  // ---- Product grid + scan/search ----
  function matchExact(code) {
    const c = code.trim().toLowerCase();
    if (!c) return null;
    return catalogue.find(p => (p.barcode || '').toLowerCase() === c) ||
           catalogue.find(p => (p.sku || '').toLowerCase() === c) || null;
  }
  function renderGrid() {
    const grid = document.getElementById('grid');
    const q = document.getElementById('scan').value.trim().toLowerCase();
    let items = catalogue;
    if (q) items = catalogue.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.sku || '').toLowerCase().includes(q) ||
      (p.barcode || '').toLowerCase().includes(q));
    if (items.length === 0) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${catalogue.length ? 'No matches' : 'Catalogue loading…'}</div>`; return; }
    grid.innerHTML = items.slice(0, 300).map(p => {
      const oos = (Number(p.qty) || 0) <= 0;
      const thumb = p.imageUrl
        ? `<div class="thumb" style="background-image:url('${esc(p.imageUrl)}')"></div>`
        : `<div class="thumb">📦</div>`;
      return `<button class="tile" ${oos ? 'disabled' : ''} onclick="addToCart('${p.variantId}')">
        ${thumb}
        <div class="nm">${esc(p.name)}</div>
        <div class="pr">${money(p.priceCents)}</div>
        <div class="st">${oos ? '<span style="color:var(--danger)">out of stock</span>' : 'stock ' + (Number(p.qty) || 0)}</div>
      </button>`;
    }).join('');
  }

  function onScanInput() { renderGrid(); }
  function onScanEnter() {
    const field = document.getElementById('scan');
    const code = field.value.trim();
    if (!code) return;
    const hit = matchExact(code);
    if (hit) { addToCart(hit.variantId); field.value = ''; renderGrid(); }
    else {
      // No exact barcode/SKU — if the search yields exactly one product, add it.
      const q = code.toLowerCase();
      const matches = catalogue.filter(p => (p.name || '').toLowerCase().includes(q) || (p.sku || '').toLowerCase().includes(q));
      if (matches.length === 1) { addToCart(matches[0].variantId); field.value = ''; renderGrid(); }
      else toast(matches.length ? matches.length + ' matches — tap one' : 'No product found');
    }
  }

  // ---- Cart ----
  function findProduct(variantId) { return catalogue.find(p => p.variantId === variantId) || null; }
  function addToCart(variantId) {
    const p = findProduct(variantId);
    if (!p) return;
    const line = cart.find(l => l.variantId === variantId);
    const inCart = line ? line.qty : 0;
    if (inCart + 1 > (Number(p.qty) || 0)) { toast(`Only ${Number(p.qty) || 0} of "${p.name}" in stock`); return; }
    if (line) line.qty++; else cart.push({ variantId, qty: 1 });
    renderCart();
    toast(p.name);
  }
  function changeQty(variantId, d) {
    const line = cart.find(l => l.variantId === variantId);
    if (!line) return;
    const p = findProduct(variantId);
    const next = line.qty + d;
    if (next <= 0) cart = cart.filter(l => l.variantId !== variantId);
    else { if (p && next > (Number(p.qty) || 0)) { toast(`Only ${Number(p.qty) || 0} in stock`); return; } line.qty = next; }
    renderCart();
  }
  function removeLine(variantId) { cart = cart.filter(l => l.variantId !== variantId); renderCart(); }
  function clearCart() { if (cart.length && !confirm('Clear the cart?')) return; cart = []; cartDiscount = null; renderCart(); }

  // Parse a discount input: "10%" → {type:'pct',value:10}; "50" → {type:'amt',value:5000 cents}.
  function parseDiscount(str) {
    const s = String(str || '').trim();
    if (!s) return null;
    if (s.endsWith('%')) { const v = parseFloat(s) || 0; return v > 0 ? { type: 'pct', value: Math.min(100, v) } : null; }
    const c = toCents(s); return c > 0 ? { type: 'amt', value: c } : null;
  }
  function discLabel(d) { return d ? (d.type === 'pct' ? d.value + '% off' : money(d.value) + ' off') : ''; }
  function lineDiscount(variantId) {
    const l = cart.find(x => x.variantId === variantId); if (!l) return;
    const v = prompt('Line discount — e.g. "10%" or "50" (R off). Blank to clear:', l.disc ? (l.disc.type === 'pct' ? l.disc.value + '%' : (l.disc.value / 100).toFixed(2)) : '');
    if (v === null) return;
    l.disc = parseDiscount(v); renderCart();
  }
  function setCartDiscount() {
    const v = prompt('Cart discount — e.g. "10%" or "50" (R off). Blank to clear:', cartDiscount ? (cartDiscount.type === 'pct' ? cartDiscount.value + '%' : (cartDiscount.value / 100).toFixed(2)) : '');
    if (v === null) return;
    cartDiscount = parseDiscount(v); renderCart();
  }

  // Compute the whole cart in integer cents, applying line then cart discounts.
  // Cart discount is distributed across lines proportionally so per-line unit
  // prices (sent to Shopify) sum exactly to the total.
  function computeCart() {
    const lines = cart.map(l => {
      const p = findProduct(l.variantId);
      const base = p ? p.priceCents * l.qty : 0;
      let lineDisc = 0;
      if (l.disc) lineDisc = l.disc.type === 'pct' ? Math.round(base * l.disc.value / 100) : Math.min(base, l.disc.value);
      return { variantId: l.variantId, qty: l.qty, p, base, afterLine: base - lineDisc, lineDisc };
    });
    const subtotal = lines.reduce((t, x) => t + x.afterLine, 0);
    let cartDisc = 0;
    if (cartDiscount && subtotal > 0) cartDisc = cartDiscount.type === 'pct' ? Math.round(subtotal * cartDiscount.value / 100) : Math.min(subtotal, cartDiscount.value);
    // Distribute cartDisc proportionally; fix rounding on the last line.
    let allocated = 0;
    lines.forEach((x, i) => {
      let share = (subtotal > 0 && cartDisc > 0) ? Math.round(cartDisc * x.afterLine / subtotal) : 0;
      if (i === lines.length - 1) share = cartDisc - allocated; // remainder
      allocated += share;
      x.finalLine = Math.max(0, x.afterLine - share);
      x.finalUnit = x.qty > 0 ? Math.round(x.finalLine / x.qty) : 0;
    });
    const total = lines.reduce((t, x) => t + x.finalLine, 0);
    const totalDisc = lines.reduce((t, x) => t + x.lineDisc, 0) + cartDisc;
    return { lines, baseSubtotal: lines.reduce((t, x) => t + x.base, 0), totalDisc, total };
  }
  function cartTotal() { return computeCart().total; } // cents

  function renderCart() {
    const el = document.getElementById('cart');
    const c = computeCart();
    if (cart.length === 0) { el.innerHTML = '<div class="empty">Scan or tap a product to start a sale.</div>'; }
    else {
      el.innerHTML = c.lines.map(x => {
        const p = x.p; if (!p) return '';
        const l = cart.find(z => z.variantId === x.variantId);
        const discTag = l && l.disc ? `<span style="color:var(--accent2)"> · ${discLabel(l.disc)}</span>` : '';
        return `<div class="line">
          <div class="lnm"><div class="t">${esc(p.name)}</div><div class="s">${money(p.priceCents)} each${discTag}</div></div>
          <button class="qbtn" onclick="changeQty('${p.variantId}',-1)">−</button>
          <span class="qty">${x.qty}</span>
          <button class="qbtn" onclick="changeQty('${p.variantId}',1)">+</button>
          <span class="ltot">${money(x.finalLine)}</span>
          <button class="qbtn" title="Line discount" onclick="lineDiscount('${p.variantId}')">%</button>
          <button class="rm" onclick="removeLine('${p.variantId}')" title="Remove">✕</button>
        </div>`;
      }).join('') + `<div style="display:flex; justify-content:space-between; align-items:center; padding:0.6rem 0 0; font-size:0.8rem; color:var(--muted)">
          <button class="qbtn" style="width:auto; padding:0 0.6rem; height:30px" onclick="setCartDiscount()">${cartDiscount ? 'Cart disc: ' + discLabel(cartDiscount) : '+ Cart discount'}</button>
          ${c.totalDisc > 0 ? `<span>−${money(c.totalDisc)} saved</span>` : ''}
        </div>`;
    }
    const count = cart.reduce((n, l) => n + l.qty, 0);
    document.getElementById('grand').textContent = money(c.total);
    const payBtn = document.getElementById('pay-btn');
    payBtn.textContent = `Pay · ${count} item${count === 1 ? '' : 's'}`;
    payBtn.disabled = count === 0;
    payBtn.style.opacity = count === 0 ? '0.5' : '1';
  }

  // ---- Customers ----
  async function api(action, extra) {
    const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...(extra || {}) }) });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + (await res.text()).slice(0, 120));
    return res.json();
  }
  function renderCustomer() {
    const el = document.getElementById('customer');
    if (!el) return;
    if (customer) {
      el.innerHTML = `<div class="cinfo"><div class="cn">👤 ${esc(customer.name)}</div><div class="cm">${esc(customer.phone || customer.email || '')}</div></div>
        <div style="display:flex; gap:0.35rem"><button onclick="custHistory()">History</button><button onclick="custClear()">✕</button></div>`;
    } else {
      el.innerHTML = `<div class="cinfo"><div class="cn" style="color:var(--muted)">Walk-in customer</div></div>
        <button onclick="custOpen()">+ Add customer</button>`;
    }
  }
  function custClear() { customer = null; renderCustomer(); }
  function custOpen() { document.getElementById('cust-modal').classList.add('show'); renderCustBody(''); }
  function custClose() { document.getElementById('cust-modal').classList.remove('show'); }
  function renderCustBody(q, results) {
    const body = document.getElementById('cust-body');
    body.innerHTML = `
      <input id="cust-q" autocomplete="off" placeholder="🔍 Search by name / email / phone" value="${esc(q || '')}" oninput="custSearch(this.value)">
      <div id="cust-results" style="max-height:220px; overflow:auto; margin:0.6rem 0">${results === undefined ? '<div class="empty" style="padding:1rem">Type to search Shopify customers</div>' : renderCustResults(results)}</div>
      <div style="border-top:1px solid var(--border); padding-top:0.7rem">
        <div style="font-size:0.8rem; font-weight:700; margin-bottom:0.4rem">New customer</div>
        <input id="nc-name" placeholder="Name *" style="width:100%; margin-bottom:0.4rem">
        <div style="display:flex; gap:0.4rem">
          <input id="nc-phone" placeholder="Phone" style="flex:1">
          <input id="nc-email" placeholder="Email" style="flex:1">
        </div>
        <button class="btn btn-pay" style="margin-top:0.55rem" onclick="custCreate()">+ Create &amp; attach</button>
      </div>`;
    const i = document.getElementById('cust-q'); if (i) i.focus();
  }
  function renderCustResults(list) {
    if (!list || !list.length) return '<div class="empty" style="padding:1rem">No matches</div>';
    return list.map(c => `<div class="cust-result" onclick='custAttach(${JSON.stringify(c).replace(/'/g, "&#39;")})'>
      <div><div style="font-weight:600">${esc(c.name)}</div><div style="font-size:0.72rem;color:var(--muted)">${esc(c.phone || c.email || '')}</div></div></div>`).join('');
  }
  function custSearch(q) {
    clearTimeout(custSearchTimer);
    const term = q.trim();
    const box = document.getElementById('cust-results');
    if (!term) { box.innerHTML = '<div class="empty" style="padding:1rem">Type to search Shopify customers</div>'; return; }
    box.innerHTML = '<div class="empty" style="padding:1rem">Searching…</div>';
    custSearchTimer = setTimeout(async () => {
      try { const { customers } = await api('searchCustomers', { q: term }); box.innerHTML = renderCustResults(customers); }
      catch (e) { box.innerHTML = `<div class="empty" style="padding:1rem; color:var(--warn)">${esc(String(e.message || e))}</div>`; }
    }, 350);
  }
  function custAttach(c) { customer = c; custClose(); renderCustomer(); }
  async function custCreate() {
    const name = (document.getElementById('nc-name').value || '').trim();
    if (!name) { toast('Enter a customer name'); return; }
    try {
      const { customer: c } = await api('createCustomer', { name, phone: (document.getElementById('nc-phone').value || '').trim(), email: (document.getElementById('nc-email').value || '').trim() });
      custAttach(c); toast('Customer created');
    } catch (e) { toast('Create failed: ' + (e.message || e)); }
  }
  async function custHistory() {
    if (!customer) return;
    custOpen();
    const body = document.getElementById('cust-body');
    body.innerHTML = `<div style="font-weight:700; margin-bottom:0.5rem">${esc(customer.name)} — purchase history</div><div id="cust-hist"><div class="empty" style="padding:1rem">Loading…</div></div><button class="btn btn-pay" style="margin-top:0.6rem" onclick="renderCustBody('')">← Back to search</button>`;
    try {
      const { orders } = await api('customerOrders', { customerId: customer.id });
      const h = document.getElementById('cust-hist');
      h.innerHTML = orders.length ? orders.map(o => `<div class="cust-result" style="cursor:default"><div><div style="font-weight:600">${esc(o.name)}</div><div style="font-size:0.72rem;color:var(--muted)">${new Date(o.createdAt).toLocaleDateString('en-ZA')} · ${o.items} item${o.items === 1 ? '' : 's'}</div></div><div style="font-weight:700">${money(o.totalCents)}</div></div>`).join('') : '<div class="empty" style="padding:1rem">No previous orders</div>';
    } catch (e) { document.getElementById('cust-hist').innerHTML = '<div class="empty" style="padding:1rem">Could not load history</div>'; }
  }

  // ---- Staff PINs + register / cash-up ----
  let currentStaff = null;
  let pinBuffer = '';
  function staffList() { try { return JSON.parse(localStorage.getItem('reptipos-staff') || '[]'); } catch (e) { return []; } }
  function saveStaff(arr) { localStorage.setItem('reptipos-staff', JSON.stringify(arr)); }
  function ensureStaffSeed() { if (staffList().length === 0) saveStaff([{ id: 'admin', name: 'Admin', pin: '0000', role: 'admin' }]); }
  function renderStaffBadge() { const b = document.getElementById('staff-badge'); if (b) b.textContent = currentStaff ? '👤 ' + currentStaff.name : ''; }

  function lockPOS() { currentStaff = null; pinBuffer = ''; renderStaffBadge(); renderLockPad(); document.getElementById('lock').style.display = 'flex'; }
  function renderLockPad() {
    document.getElementById('lock-dots').textContent = '••••'.slice(0, pinBuffer.length).padEnd(4, '·');
    const pad = document.getElementById('lock-pad');
    pad.innerHTML = ['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k =>
      `<button class="qbtn" style="height:64px; font-size:1.3rem" onclick="pinKey('${k}')">${k}</button>`).join('');
  }
  function pinKey(k) {
    if (k === 'C') pinBuffer = '';
    else if (k === '⌫') pinBuffer = pinBuffer.slice(0, -1);
    else if (pinBuffer.length < 6) pinBuffer += k;
    document.getElementById('lock-dots').textContent = (pinBuffer.replace(/./g, '•') || '').padEnd(4, '·');
    if (pinBuffer.length >= 4) {
      const s = staffList().find(x => x.pin === pinBuffer);
      if (s) { currentStaff = s; pinBuffer = ''; document.getElementById('lock').style.display = 'none'; renderStaffBadge(); }
      else if (pinBuffer.length >= 6) { toast('Wrong PIN'); pinBuffer = ''; renderLockPad(); }
    }
  }

  function getShift() { try { return JSON.parse(localStorage.getItem('reptipos-shift') || 'null'); } catch (e) { return null; } }
  function saveShift(s) { if (s) localStorage.setItem('reptipos-shift', JSON.stringify(s)); else localStorage.removeItem('reptipos-shift'); }
  function expectedCashCents(s) { return s.floatCents + s.cashSalesCents + s.payInsCents - s.cashRefundsCents - s.payOutsCents; }
  function shiftRecordSale(sale) {
    const s = getShift(); if (!s) return;
    const p = sale.payment;
    if (p.method === 'cash') s.cashSalesCents += sale.totalCents;
    else if (p.method === 'card') s.cardSalesCents += sale.totalCents;
    else if (p.method === 'eft') s.eftSalesCents += sale.totalCents;
    else if (p.method === 'split') { s.cashSalesCents += (p.cashAmountCents || 0); s.cardSalesCents += (p.cardAmountCents || 0); }
    s.salesCount += 1;
    s.byStaff = s.byStaff || {};
    const who = sale.staff || '—';
    s.byStaff[who] = (s.byStaff[who] || 0) + sale.totalCents;
    saveShift(s);
  }

  function openReg() { document.getElementById('reg-modal').classList.add('show'); renderReg(); }
  function closeReg() { document.getElementById('reg-modal').classList.remove('show'); }
  function renderReg() {
    const body = document.getElementById('reg-body');
    const s = getShift();
    if (!s) {
      body.innerHTML = `<div class="field"><div style="color:var(--muted); font-size:0.85rem; margin-bottom:0.6rem">No register open.</div>
        <label>Opening float (R)</label><input id="reg-float" type="number" step="0.01" value="0.00">
        <button class="btn btn-pay" style="margin-top:0.7rem" onclick="doOpenRegister()">Open register</button></div>
        <div style="border-top:1px solid var(--border); margin-top:0.9rem; padding-top:0.7rem">${staffAdmin()}</div>`;
      return;
    }
    const exp = expectedCashCents(s);
    body.innerHTML = `
      <div style="font-size:0.8rem; color:var(--muted)">Opened ${new Date(s.openedAt).toLocaleString('en-ZA')}${s.openedBy ? ' · ' + esc(s.openedBy) : ''}</div>
      <table style="width:100%; font-size:0.9rem; margin:0.6rem 0; border-collapse:collapse">
        ${[['Opening float', s.floatCents], ['Cash sales', s.cashSalesCents], ['Card sales', s.cardSalesCents], ['EFT sales', s.eftSalesCents], ['Pay-ins', s.payInsCents], ['Pay-outs', -s.payOutsCents], ['Cash refunds', -s.cashRefundsCents]].map(([k, v]) => `<tr><td style="padding:2px 0; color:var(--muted)">${k}</td><td style="text-align:right">${money(v)}</td></tr>`).join('')}
        <tr><td style="padding-top:6px; font-weight:700; border-top:1px solid var(--border)">Expected cash in drawer</td><td style="text-align:right; font-weight:700; border-top:1px solid var(--border)">${money(exp)}</td></tr>
        <tr><td>Sales count</td><td style="text-align:right">${s.salesCount}</td></tr>
      </table>
      <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:0.7rem">
        <button class="qbtn" style="width:auto; padding:0 0.7rem" onclick="payInOut('in')">+ Pay-in</button>
        <button class="qbtn" style="width:auto; padding:0 0.7rem" onclick="payInOut('out')">− Pay-out</button>
        <button class="qbtn" style="width:auto; padding:0 0.7rem" onclick="printXZ('X')">X-report</button>
      </div>
      <label>Count the cash drawer (R)</label>
      <input id="reg-count" type="number" step="0.01" value="${(exp / 100).toFixed(2)}" oninput="document.getElementById('reg-var').textContent='Variance: '+money(toCents(this.value)-${exp})">
      <div class="change" id="reg-var">Variance: R0.00</div>
      <button class="btn btn-pay" style="margin-top:0.7rem; background:var(--danger); color:#fff" onclick="closeRegister()">Close register (Z-report)</button>`;
  }
  function staffAdmin() {
    if (!currentStaff || currentStaff.role !== 'admin') return '';
    const list = staffList();
    return `<div style="font-size:0.8rem; font-weight:700; margin-bottom:0.4rem">Staff</div>
      ${list.map(s => `<div style="display:flex; justify-content:space-between; padding:0.25rem 0; font-size:0.85rem"><span>${esc(s.name)} <span style="color:var(--muted)">(${s.role})</span></span>${s.id !== 'admin' ? `<button class="rm" onclick="removeStaff('${s.id}')">✕</button>` : ''}</div>`).join('')}
      <div style="display:flex; gap:0.4rem; margin-top:0.4rem"><input id="st-name" placeholder="Name" style="flex:1"><input id="st-pin" placeholder="PIN" style="width:80px"></div>
      <button class="qbtn" style="width:auto; padding:0 0.7rem; margin-top:0.4rem" onclick="addStaff()">+ Add staff</button>`;
  }
  function addStaff() {
    const name = (document.getElementById('st-name').value || '').trim();
    const pin = (document.getElementById('st-pin').value || '').trim();
    if (!name || !/^\d{4,6}$/.test(pin)) { toast('Name + 4–6 digit PIN'); return; }
    const list = staffList();
    if (list.some(s => s.pin === pin)) { toast('PIN already in use'); return; }
    list.push({ id: 'st-' + Date.now(), name, pin, role: 'cashier' });
    saveStaff(list); renderReg(); toast('Staff added');
  }
  function removeStaff(id) { if (!confirm('Remove this staff member?')) return; saveStaff(staffList().filter(s => s.id !== id)); renderReg(); }
  function doOpenRegister() {
    const f = toCents(document.getElementById('reg-float').value);
    saveShift({ id: 'SHIFT-' + Date.now(), openedAt: new Date().toISOString(), openedBy: currentStaff ? currentStaff.name : '', floatCents: f, cashSalesCents: 0, cardSalesCents: 0, eftSalesCents: 0, cashRefundsCents: 0, payInsCents: 0, payOutsCents: 0, salesCount: 0, byStaff: {} });
    renderReg(); toast('Register opened');
  }
  function payInOut(dir) {
    const s = getShift(); if (!s) return;
    const v = toCents(prompt((dir === 'in' ? 'Pay-IN' : 'Pay-OUT') + ' amount (R):', '0'));
    if (v <= 0) return;
    if (dir === 'in') s.payInsCents += v; else s.payOutsCents += v;
    saveShift(s); renderReg();
  }
  function zReportHtml(s, countedCents, kind) {
    const exp = expectedCashCents(s);
    const variance = countedCents != null ? countedCents - exp : null;
    return `<h2 style="text-align:center;margin:.2rem 0">ReptiCube — ${kind}-report</h2>
      <div class="c">${new Date().toLocaleString('en-ZA')}</div>
      <div class="c">Opened ${new Date(s.openedAt).toLocaleString('en-ZA')}</div>
      <table>
        <tr><td>Opening float</td><td style="text-align:right">${money(s.floatCents)}</td></tr>
        <tr><td>Cash sales</td><td style="text-align:right">${money(s.cashSalesCents)}</td></tr>
        <tr><td>Card sales</td><td style="text-align:right">${money(s.cardSalesCents)}</td></tr>
        <tr><td>EFT sales</td><td style="text-align:right">${money(s.eftSalesCents)}</td></tr>
        <tr><td>Pay-ins</td><td style="text-align:right">${money(s.payInsCents)}</td></tr>
        <tr><td>Pay-outs</td><td style="text-align:right">−${money(s.payOutsCents)}</td></tr>
        <tr><td>Cash refunds</td><td style="text-align:right">−${money(s.cashRefundsCents)}</td></tr>
        <tr class="tot"><td>Total sales</td><td style="text-align:right">${money(s.cashSalesCents + s.cardSalesCents + s.eftSalesCents)}</td></tr>
        <tr><td>Sales count</td><td style="text-align:right">${s.salesCount}</td></tr>
        <tr class="tot"><td>Expected cash</td><td style="text-align:right">${money(exp)}</td></tr>
        ${countedCents != null ? `<tr><td>Counted</td><td style="text-align:right">${money(countedCents)}</td></tr><tr class="tot"><td>Variance</td><td style="text-align:right">${money(variance)}</td></tr>` : ''}
      </table>
      <div class="c" style="font-weight:700; margin-top:6px">By staff</div>
      <table>${Object.entries(s.byStaff || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td style="text-align:right">${money(v)}</td></tr>`).join('') || '<tr><td>—</td><td></td></tr>'}</table>`;
  }
  function printReport(html) {
    const w = window.open('', '_blank', 'width=360,height=640'); if (!w) { toast('Allow pop-ups'); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Report</title><style>@media print{@page{size:80mm auto;margin:4mm}.noprint{display:none}}body{font-family:'Courier New',monospace;width:80mm;margin:0 auto;padding:8px;color:#000}.c{text-align:center;font-size:12px}table{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:13px}td{padding:2px 0}.tot{border-top:1px dashed #000;font-weight:bold}.btns{margin-top:10px}.btns button{width:100%;padding:10px;border:1px solid #000;border-radius:8px;background:#fff;cursor:pointer}</style></head><body>${html}<div class="btns noprint"><button onclick="window.print()">🖨️ Print</button></div></body></html>`);
    w.document.close();
  }
  function printXZ(kind) { const s = getShift(); if (!s) return; printReport(zReportHtml(s, null, kind)); }
  function closeRegister() {
    const s = getShift(); if (!s) return;
    const counted = toCents(document.getElementById('reg-count').value);
    if (!confirm('Close the register and print the Z-report?')) return;
    const record = { ...s, closedAt: new Date().toISOString(), closedBy: currentStaff ? currentStaff.name : '', countedCents: counted, varianceCents: counted - expectedCashCents(s) };
    try { const arr = JSON.parse(localStorage.getItem('reptipos-shifts') || '[]'); arr.unshift(record); localStorage.setItem('reptipos-shifts', JSON.stringify(arr.slice(0, 200))); } catch (e) {}
    try { if (window.fb) { const { db, fns } = window.fb; fns.addDoc(fns.collection(db, 'cashups'), record); } } catch (e) {}
    printReport(zReportHtml(s, counted, 'Z'));
    saveShift(null);
    closeReg(); renderReg(); toast('Register closed');
  }

  // ---- Park / retrieve (Shopify draft orders) ----
  async function parkSale() {
    if (cart.length === 0) { toast('Cart is empty'); return; }
    toast('Parking…');
    try {
      const parkData = { cart, cartDiscount, customer };
      const out = await api('parkSale', { lineItems: cart.map(l => ({ variantId: l.variantId, qty: l.qty })), customerId: customer ? customer.id : undefined, parkData });
      cart = []; cartDiscount = null; customer = null;
      renderCart(); renderCustomer(); renderGrid();
      toast('Parked ' + (out.name || ''));
    } catch (e) { toast('Park failed: ' + (e.message || e)); }
  }
  function closeParked() { document.getElementById('park-modal').classList.remove('show'); }
  async function openParked() {
    document.getElementById('park-modal').classList.add('show');
    const body = document.getElementById('park-body');
    body.innerHTML = '<div class="empty" style="padding:1.5rem">Loading…</div>';
    try {
      const { parked } = await api('listParked');
      if (!parked.length) { body.innerHTML = '<div class="empty" style="padding:1.5rem">No parked sales</div>'; return; }
      body.innerHTML = parked.map(d => `<div class="cust-result" style="cursor:default">
        <div><div style="font-weight:600">${esc(d.name)}${d.customerName ? ' · ' + esc(d.customerName) : ''}</div>
          <div style="font-size:0.72rem;color:var(--muted)">${new Date(d.createdAt).toLocaleString('en-ZA')} · ${money(d.totalCents)}</div></div>
        <div style="display:flex; gap:0.4rem">
          <button class="qbtn" style="width:auto;padding:0 0.7rem" onclick='retrieveParked(${JSON.stringify(d).replace(/'/g, "&#39;")})'>Open</button>
          <button class="rm" onclick="deleteParked('${d.id}')">✕</button>
        </div></div>`).join('');
    } catch (e) { body.innerHTML = `<div class="empty" style="padding:1.5rem; color:var(--warn)">${esc(String(e.message || e))}</div>`; }
  }
  async function retrieveParked(d) {
    if (cart.length && !confirm('Replace the current cart with the parked sale?')) return;
    const pd = d.parkData || {};
    cart = Array.isArray(pd.cart) ? pd.cart : [];
    cartDiscount = pd.cartDiscount || null;
    customer = pd.customer || null;
    closeParked();
    renderCart(); renderCustomer(); renderGrid();
    try { await api('deleteParked', { id: d.id }); } catch (e) { /* it'll just linger in the parked list */ }
    toast('Retrieved ' + (d.name || ''));
  }
  async function deleteParked(id) {
    if (!confirm('Delete this parked sale?')) return;
    try { await api('deleteParked', { id }); openParked(); } catch (e) { toast('Delete failed'); }
  }

  // ---- Payments (Phase 2) ----
  function payOpen() {
    if (cart.length === 0) { toast('Cart is empty'); return; }
    document.getElementById('pay-total').textContent = money(cartTotal());
    document.getElementById('pay-detail').innerHTML = '';
    document.getElementById('pay-modal').classList.add('show');
  }
  function payClose() { document.getElementById('pay-modal').classList.remove('show'); }

  function payPick(method) {
    const total = cartTotal(); // cents
    const rands = (total / 100).toFixed(2);
    const d = document.getElementById('pay-detail');
    if (method === 'card' || method === 'eft') {
      const label = method === 'card' ? 'Card' : 'EFT';
      const note = method === 'card' ? `Charge ${money(total)} on the Capitec speedpoint, then confirm.` : `Confirm the ${money(total)} EFT has reflected, then complete.`;
      d.innerHTML = `<div class="field"><div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.6rem">${note}</div>
        <button class="btn btn-pay" onclick="completeSale({method:'${method}'})">✓ ${label} — paid · ${money(total)}</button></div>`;
    } else if (method === 'cash') {
      d.innerHTML = `<div class="field"><label>Cash tendered</label>
        <input id="cash-in" type="number" inputmode="decimal" step="0.01" value="${rands}" oninput="cashChange()">
        <div class="change" id="cash-change">Change: R0.00</div>
        <button class="btn btn-pay" style="margin-top:0.7rem" onclick="confirmCash()">✓ Complete cash sale</button></div>`;
      const inp = document.getElementById('cash-in'); inp.focus(); inp.select(); cashChange();
    } else {
      d.innerHTML = `<div class="field"><label>Cash portion</label>
        <input id="split-cash" type="number" inputmode="decimal" step="0.01" value="0.00" oninput="splitCalc()">
        <label style="margin-top:0.6rem">Card portion</label>
        <input id="split-card" type="number" inputmode="decimal" step="0.01" value="${rands}" oninput="splitCalc()">
        <div class="change" id="split-msg"></div>
        <button class="btn btn-pay" style="margin-top:0.7rem" id="split-btn" onclick="confirmSplit()">✓ Complete split sale</button></div>`;
      splitCalc();
    }
  }
  function cashChange() {
    const total = cartTotal();
    const t = toCents(document.getElementById('cash-in').value);
    document.getElementById('cash-change').textContent = 'Change: ' + money(Math.max(0, t - total));
  }
  function confirmCash() {
    const total = cartTotal();
    const t = toCents(document.getElementById('cash-in').value);
    if (t < total) { toast('Cash tendered is less than the total'); return; }
    completeSale({ method: 'cash', cashAmountCents: total, cashTenderedCents: t, changeCents: t - total });
  }
  function splitCalc() {
    const total = cartTotal();
    const cash = toCents(document.getElementById('split-cash').value);
    const card = toCents(document.getElementById('split-card').value);
    const ok = (cash + card) === total;
    document.getElementById('split-msg').textContent = ok ? '✓ Balances' : `Must total ${money(total)} (currently ${money(cash + card)})`;
    document.getElementById('split-msg').style.color = ok ? 'var(--accent2)' : 'var(--warn)';
    const btn = document.getElementById('split-btn'); btn.disabled = !ok; btn.style.opacity = ok ? '1' : '0.5';
  }
  function confirmSplit() {
    const total = cartTotal();
    const cash = toCents(document.getElementById('split-cash').value);
    const card = toCents(document.getElementById('split-card').value);
    if (cash + card !== total) { toast('Split must total the sale'); return; }
    completeSale({ method: 'split', cashAmountCents: cash, cardAmountCents: card });
  }

  function nextSaleNumber() {
    const seq = (parseInt(localStorage.getItem('reptipos-seq') || '0', 10) || 0) + 1;
    localStorage.setItem('reptipos-seq', String(seq));
    const d = new Date();
    const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    return 'RC-' + ymd + '-' + String(seq).padStart(4, '0');
  }
  function paymentSummary(p) {
    if (p.method === 'cash') return `Cash (tendered ${money(p.cashTenderedCents)}, change ${money(p.changeCents)})`;
    if (p.method === 'card') return 'Card (Capitec — paid)';
    if (p.method === 'eft') return 'EFT (paid)';
    return `Split: cash ${money(p.cashAmountCents)} + card ${money(p.cardAmountCents)}`;
  }

  async function completeSale(payment) {
    if (saleInFlight) return;          // guard: never double-submit one sale
    if (cart.length === 0) { toast('Cart is empty'); return; }
    saleInFlight = true;
    const c = computeCart();
    const total = c.total; // cents (after discounts)
    const items = c.lines.map(x => ({ variantId: x.variantId, name: x.p.name, sku: x.p.sku, listPriceCents: x.p.priceCents, priceCents: x.finalUnit, qty: x.qty, lineTotalCents: x.finalLine }));
    const sale = {
      saleNumber: nextSaleNumber(),
      idemKey: uuid(),                 // idempotency key — same sale never creates two Shopify orders
      datetime: new Date().toISOString(),
      items, totalCents: total, discountCents: c.totalDisc, payment,
      customer: customer ? { id: customer.id, name: customer.name } : null,
      staff: currentStaff ? currentStaff.name : null,
      shopifyOrder: null, synced: false
    };
    payClose();

    // Record locally first (always survives).
    try { const arr = JSON.parse(localStorage.getItem('reptipos-sales') || '[]'); arr.unshift(sale); localStorage.setItem('reptipos-sales', JSON.stringify(arr.slice(0, 300))); } catch (e) {}
    // Best-effort Firestore log.
    try {
      if (window.fb) { const { db, fns } = window.fb; await fns.addDoc(fns.collection(db, 'sales'), sale); }
    } catch (e) { console.warn('Firestore sale log failed:', e); }

    // Write the sale back to Shopify (paid → stock decrements). idemKey makes a
    // retry return the SAME order instead of creating a duplicate.
    try {
      const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'createOrder', idemKey: sale.idemKey, customerId: customer ? customer.id : undefined, lineItems: items.map(i => ({ variantId: i.variantId, qty: i.qty, priceCents: i.priceCents })), note: sale.saleNumber + ' · ' + paymentSummary(payment) }) });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + (await res.text()).slice(0, 120));
      const out = await res.json();
      sale.shopifyOrder = out.orderName || null; sale.synced = true;
      updateLocalSale(sale);
      toast('Sale ' + sale.saleNumber + ' · Shopify ' + (out.orderName || 'created'));
    } catch (e) {
      console.warn('Shopify order failed:', e);
      toast('Sale saved — Shopify order failed (will retry in Phase 3 offline queue)');
    }

    // Record against the open register shift (cash-up).
    shiftRecordSale(sale);
    // Reflect stock locally + reset.
    items.forEach(i => { const p = findProduct(i.variantId); if (p) p.qty = Math.max(0, (Number(p.qty) || 0) - i.qty); });
    cacheCatalogue();
    cart = [];
    cartDiscount = null;
    customer = null; renderCustomer();
    renderCart(); renderGrid();
    showReceipt(sale);
    saleInFlight = false;
    scan.focus();
  }

  function updateLocalSale(sale) {
    try { const arr = JSON.parse(localStorage.getItem('reptipos-sales') || '[]'); const i = arr.findIndex(s => s.saleNumber === sale.saleNumber); if (i >= 0) { arr[i] = sale; localStorage.setItem('reptipos-sales', JSON.stringify(arr)); } } catch (e) {}
  }

  // ---- Receipt: clean slip, NO VAT. Print (80mm) + WhatsApp ----
  function receiptText(sale) {
    const dt = new Date(sale.datetime).toLocaleString('en-ZA');
    let t = `ReptiCube\nSale ${sale.saleNumber}\n${dt}\n`;
    t += '--------------------------------\n';
    sale.items.forEach(i => { t += `${i.qty} x ${i.name}\n   ${money(i.lineTotalCents)}\n`; });
    t += '--------------------------------\n';
    if (sale.discountCents) t += `Discount  -${money(sale.discountCents)}\n`;
    t += `TOTAL  ${money(sale.totalCents)}\n`;
    t += `Paid: ${paymentSummary(sale.payment)}\n`;
    t += 'Thank you!';
    return t;
  }
  function showReceipt(sale) {
    const dt = new Date(sale.datetime).toLocaleString('en-ZA');
    const rows = sale.items.map(i => `<tr><td>${esc(i.qty)} × ${esc(i.name)}</td><td style="text-align:right">${money(i.lineTotalCents)}</td></tr>`).join('');
    const waText = encodeURIComponent(receiptText(sale));
    const emailSubject = encodeURIComponent('ReptiCube invoice ' + sale.saleNumber);
    const w = window.open('', '_blank', 'width=360,height=640');
    if (!w) { toast('Allow pop-ups to print the slip'); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(sale.saleNumber)}</title>
      <style>
        @media print { @page { size:80mm auto; margin:4mm; } .noprint{display:none} }
        body{font-family:'Courier New',monospace; width:80mm; margin:0 auto; padding:8px; color:#000}
        h2{text-align:center; margin:0.2rem 0}
        .c{text-align:center; font-size:12px}
        table{width:100%; border-collapse:collapse; margin:0.5rem 0; font-size:13px}
        td{padding:2px 0; vertical-align:top}
        .tot{border-top:1px dashed #000; font-weight:bold; font-size:16px}
        .btns{margin-top:12px; display:flex; gap:8px}
        .btns a,.btns button{flex:1; text-align:center; padding:10px; border:1px solid #000; border-radius:8px; background:#fff; font-size:13px; text-decoration:none; color:#000; cursor:pointer}
      </style></head><body>
      <h2>ReptiCube</h2>
      <div class="c">Sale ${esc(sale.saleNumber)}</div>
      <div class="c">${esc(dt)}</div>
      ${sale.customer ? `<div class="c">Customer: ${esc(sale.customer.name)}</div>` : ''}
      <table>${rows}${sale.discountCents ? `<tr><td>Discount</td><td style="text-align:right">−${money(sale.discountCents)}</td></tr>` : ''}<tr class="tot"><td>TOTAL</td><td style="text-align:right">${money(sale.totalCents)}</td></tr></table>
      <div class="c">Paid: ${esc(paymentSummary(sale.payment))}</div>
      ${sale.shopifyOrder ? `<div class="c">Order ${esc(sale.shopifyOrder)}</div>` : ''}
      <div class="c" style="margin-top:8px">Thank you!</div>
      <div class="btns noprint">
        <button onclick="window.print()">🖨️ Print</button>
        <a href="https://wa.me/?text=${waText}" target="_blank">WhatsApp</a>
        <button onclick="var e=prompt('Email invoice to:','');if(e!==null){location.href='mailto:'+encodeURIComponent(e)+'?subject=${emailSubject}&body=${waText}';}">✉ Email</button>
      </div>
      </body></html>`);
    w.document.close();
  }

  // ---- Keep the scan field focused (USB scanners type into the focused input) ----
  const scan = document.getElementById('scan');
  scan.addEventListener('input', onScanInput);
  scan.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); onScanEnter(); } });
  function keepFocus() { if (document.activeElement !== scan && !/^(INPUT|TEXTAREA|BUTTON)$/.test(document.activeElement.tagName)) scan.focus(); }
  document.addEventListener('click', () => setTimeout(keepFocus, 0));
  setInterval(keepFocus, 1500);

  // Expose handlers
  Object.assign(window, { refreshCatalogue, addToCart, changeQty, removeLine, clearCart,
    lineDiscount, setCartDiscount,
    parkSale, openParked, closeParked, retrieveParked, deleteParked,
    lockPOS, pinKey, openReg, closeReg, doOpenRegister, payInOut, printXZ, closeRegister, addStaff, removeStaff,
    payOpen, payClose, payPick, cashChange, confirmCash, splitCalc, confirmSplit, completeSale,
    custOpen, custClose, custClear, custSearch, custAttach, custCreate, custHistory, renderCustBody });

  // ---- Boot ----
  ensureStaffSeed();
  if (loadCached()) { document.getElementById('cat-status').textContent = catalogue.length + ' products (cached)'; renderGrid(); }
  renderCart();
  renderCustomer();
  lockPOS();              // require a staff PIN before selling (default admin PIN 0000)
  refreshCatalogue(false);
</script>
</body>
</html>
