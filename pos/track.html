<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your order</title>
<style>
  :root { --ink: #16181d; --muted: #6b7280; --line: #e5e7eb; --bg: #f6f6f4; --card: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --accent: #111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px 16px 48px; }
  .shop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0 14px; }
  .shop h1 { font-size: 17px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
  .shop .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 12px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .steps { list-style: none; margin: 4px 0 0; padding: 0; }
  .steps li { position: relative; padding: 0 0 16px 30px; color: var(--muted); }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: ''; position: absolute; left: 6px; top: 4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
  .steps li::after { content: ''; position: absolute; left: 12px; top: 20px; bottom: 2px; width: 2px; background: var(--line); }
  .steps li:last-child::after { display: none; }
  .steps li.done { color: var(--ink); }
  .steps li.done::before { background: var(--ok); border-color: var(--ok); }
  .steps li.done::after { background: var(--ok); }
  .steps li.current { font-weight: 600; }
  .steps li.current::before { box-shadow: 0 0 0 4px rgba(21,128,61,.18); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row.tot { font-weight: 700; font-size: 16px; }
  .item { padding: 8px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .x { display: flex; justify-content: space-between; gap: 12px; }
  .item .spec { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: #eef2ee; color: var(--ok); }
  .pill.warn { background: #fdf3e6; color: var(--warn); } .pill.bad { background: #fdecec; color: var(--bad); } .pill.off { background: #f0f0f0; color: var(--muted); }
  .owed { color: var(--warn); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn[disabled] { opacity: .6; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  label { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .sign-wrap { margin: 10px 0 12px; } .sign-pad { display: block; width: 100%; height: 150px; border: 1px dashed #c4c7cc; border-radius: 8px; background: #fff; touch-action: none; }
  .sign-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-top: 4px; color: var(--muted); }
  .err { color: var(--bad); }
  .center { text-align: center; padding: 40px 0; }
  @media print { .actions, .no-print { display: none; } body { background: #fff; } .card { border: 0; padding: 8px 0; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center muted">Loading…</div></div>
<script type="module" src="js/track.js"></script>
</body>
</html>
