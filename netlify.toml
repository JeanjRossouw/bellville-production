# Netlify config — static site + serverless functions for the POS integrations.
# The site itself is still just index.html (published from the repo root).
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # esbuild bundles each function with its node_modules (e.g. jose, @netlify/blobs)
  node_bundler = "esbuild"

# Friendly path for the dedicated till on the main site: /pos boots POS-only mode.
# (A separate POS site can instead use a pos.* subdomain, which auto-detects.)
[[redirects]]
  from = "/pos"
  to = "/index.html?pos=1"
  status = 200

# Short link for the live AI-readable costing report (key-protected):
# /claude-report?k=<key> — see netlify/functions/claude-report.mjs.
[[redirects]]
  from = "/claude-report"
  to = "/.netlify/functions/claude-report"
  status = 200

# Short, tidy link for a customer document: /o/<token> instead of
# /reptipos/doc.html?t=<token>. A rewrite (status 200) so the pretty path stays
# in the address bar. The old ?t= form still works — links already sent out
# must keep opening.
[[redirects]]
  from = "/o/*"
  to = "/reptipos/doc.html"
  status = 200
