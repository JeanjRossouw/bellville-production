# Netlify config — static site + serverless functions for the POS integrations.
# The site itself is still just index.html (published from the repo root).
[build]
  publish = "."
  functions = "netlify/functions"

# Firebase web API keys are public by design (they identify the project; the
# database rules protect the data), but Netlify's secret scan flags anything
# shaped like a Google key. These are the two apps' web keys: Bellville's
# (index.html) and Factory Manager's (couchpotato/js/config.js).
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB5QfSiuwjDGwZOZMHzN3BhziK_AKVeBNg,AIzaSyDchC2SgGdNn9VieudKSVOfZrHdi_GqPcg"

[functions]
  # esbuild bundles each function with its node_modules (e.g. jose, @netlify/blobs)
  node_bundler = "esbuild"

# Friendly path for the dedicated till on the main site: /pos boots POS-only mode.
# (A separate POS site can instead use a pos.* subdomain, which auto-detects.)
# ---- factorymanager.co.za: Factory Manager's own address ----
# The website at the root, the app under /app/. Same site, same functions and
# settings as the /couchpotato/ path, which keeps working. www goes to the
# address without it.
[[redirects]]
  from = "https://www.factorymanager.co.za/*"
  to = "https://factorymanager.co.za/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://factorymanager.co.za/"
  to = "/couchpotato/www/index.html"
  status = 200
  force = true
[[redirects]]
  from = "https://factorymanager.co.za/app"
  to = "/app/"
  status = 301
  force = true
[[redirects]]
  from = "https://factorymanager.co.za/app/*"
  to = "/couchpotato/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pos"
  to = "/index.html?pos=1"
  status = 200

# Short link for the live AI-readable costing report (key-protected):
# /claude-report?k=<key> — see netlify/functions/claude-report.mjs.
[[redirects]]
  from = "/claude-report"
  to = "/.netlify/functions/claude-report"
  status = 200

# Short, tidy link for a customer document: /o/<token> instead of
# /reptipos/doc.html?t=<token>. A rewrite (status 200) so the pretty path stays
# in the address bar. The old ?t= form still works — links already sent out
# must keep opening.
[[redirects]]
  from = "/o/*"
  to = "/reptipos/doc.html"
  status = 200

# The public website for the factory app (couchpotato/www), on a tidy path.
# It moves to the root of the app's own site when the app gets one.
[[redirects]]
  from = "/factory-manager"
  to = "/couchpotato/www/index.html"
  status = 200
